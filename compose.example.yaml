# Drop-in service block. Put it in your own compose file, or run it on its own with:
#   docker compose -f compose.example.yaml up -d
services:
  lombo-saga:
    build: .   # no image is published yet
    container_name: lombo-saga
    restart: unless-stopped
    env_file: .env
    read_only: true
    volumes:
      - ./rules.json:/config/rules.json:ro
    mem_limit: 128m
    # If Kavita is in another compose project, join its network:
    # networks: [media]
# networks:
#   media:
#     external: true
